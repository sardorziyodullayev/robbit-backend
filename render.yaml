databases:
  - name: robbit-postgres
    plan: free
    databaseName: robbit
    user: robbit
    region: frankfurt

services:
  - type: web
    name: robbit-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/docs-json
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.1
      - key: DB_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: robbit-postgres
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: DB_SYNC
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: PUBLIC_URL
        value: https://robbit-backend.onrender.com
      - key: SEED_ON_START
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_EMAIL
        value: admin@robbit.local
      - key: ADMIN_PASSWORD
        sync: false
