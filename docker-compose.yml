services:
  postgres:
    image: postgres:16-alpine
    container_name: robbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: robbit
      POSTGRES_PASSWORD: robbit
      POSTGRES_DB: robbit
    ports:
      - "5432:5432"
    volumes:
      - robbit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robbit -d robbit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  robbit_pgdata:
